[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-commerce-api"
version = "0.1.0"
description = "Clean Architecture FastAPI e-commerce backend"
requires-python = ">=3.11"
authors = [
    {name = "EndToEndLabCR Team", email = "team@endtoendlabcr.com"}
]
readme = "README.md"
license = {text = "MIT"}

# Production dependencies only
dependencies = [
    "fastapi==0.115.11",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "email-validator==2.2.0",
    "aiosmtplib==4.0.0",
    "python-dotenv==1.0.1",
    "SQLAlchemy==2.0.39",
    "psycopg2-binary==2.9.10",
    "gunicorn==23.0.0",
    "backoff==2.2.1",
    "pyaml-env==1.2.2",
    "passlib[bcrypt]==1.7.4",
    "pyjwt==2.10.1",
    "python-jose[cryptography]==3.4.0",
    "alembic==1.15.1",
    "asyncpg==0.30.0",
    "greenlet==3.3.0",
    "aiosqlite==0.20.0",
    "python-json-logger==4.1.0",
]

# Development dependencies (NOT installed in Docker production)
[project.optional-dependencies]
dev = [
    "pytest==7.4.2",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.1",  # For FastAPI TestClient
    "mypy>=1.5.0",
    "ruff>=0.1.0",
]

# Pytest configuration
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten later
ignore_missing_imports = true
exclude = ["venv", "alembic"]

# Ruff configuration (linter + formatter)
[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
