app:
  name: "App API"
  version: "1.0.0"

persistence:
  driver: postgresql
  postgres:
    username: !ENV ${POSTGRES_USER}
    password: !ENV ${POSTGRES_PASSWORD}
    host: localhost
    port: 5432
    dbname: !ENV ${POSTGRES_DB}
    echo: true
    pool_size: 10
    max_overflow: 10
    pool_timeout: 30
    pool_pre_ping: true
